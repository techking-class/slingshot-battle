<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>테크킹 운동회 새총 대전</title>

<style>
:root{--bg:#e9efe1;--panel:#2f5a2c;--panel2:#3d6e38;--chalk:#f7f5ec;--chalk2:#cfe0c4;--ink:#1f2a1d;--gold:#EFB13A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a11;--panel:#1d3a1c;--panel2:#285026;--chalk:#f1efe8;--chalk2:#b9cfae;--ink:#e9efe1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a11;--panel:#1d3a1c;--panel2:#285026;--chalk:#f1efe8;--chalk2:#b9cfae;--ink:#e9efe1;color-scheme:dark}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#game{display:block;width:100%;height:100%;background:#9cc26e}
.jua{font-family:"Jua",system-ui,sans-serif;font-weight:400}
#hud{position:absolute;left:0;right:0;top:0;pointer-events:none;display:flex;justify-content:center;padding:8px}
#score{display:flex;border-radius:14px;overflow:hidden;background:#2b2b2b;color:#fff;font-size:15px;border:3px solid #1b1b1b;box-shadow:0 4px 0 #1b1b1b;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#score .t{padding:6px 12px;display:flex;flex-direction:column;align-items:center;min-width:86px}
#score .t0{background:rgba(216,90,48,.88)}#score .t1{background:rgba(106,96,208,.92)}
#score .mid{padding:6px 12px;display:flex;flex-direction:column;align-items:center;min-width:92px}
#score small{font-size:11px;opacity:.9}
#clock{font-size:20px;line-height:1.1}
body.tv #score{font-size:24px}body.tv #score .t{min-width:170px;padding:10px 18px}body.tv #clock{font-size:34px}body.tv #score small{font-size:15px}
#tools{position:absolute;left:10px;top:10px;display:flex;gap:6px}
#tools button{width:40px;height:40px;border-radius:10px;border:3px solid #1b1b1b;box-shadow:0 3px 0 #1b1b1b;background:#3E5C8A;color:#fff;font-size:18px;cursor:pointer}
#me{position:absolute;left:10px;top:62px;pointer-events:none;color:#fff;background:rgba(30,30,30,.82);border:3px solid #1b1b1b;padding:6px 10px;border-radius:10px;font-size:13px;line-height:1.5}
#mini{position:absolute;right:10px;top:64px;width:180px;height:108px;border-radius:8px;border:2px solid rgba(255,255,255,.8);pointer-events:none}
#banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:#fff;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.45);pointer-events:none;text-align:center;line-height:1.5}
body.tv #banner{font-size:34px}
#banner.big{font-size:96px;color:#FFC93C;-webkit-text-stroke:4px #1b1b1b;text-shadow:0 6px 0 #1b1b1b;animation:pop .35s}
#news{position:absolute;top:84px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;width:max-content;max-width:90%}
.nw{background:#fff;color:#1b1b1b;border:3px solid #1b1b1b;border-radius:12px;padding:4px 12px;font-size:14px;box-shadow:0 3px 0 #1b1b1b;animation:pop .25s;transition:opacity .4s}
.nw.t0{border-left:12px solid #D85A30}.nw.t1{border-left:12px solid #6A60D0}
body.tv .nw{font-size:20px}body.tv #news{top:132px}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
#skills{position:absolute;right:14px;bottom:18px;display:flex;gap:12px;align-items:flex-end}
.skrow{display:flex;flex-direction:column;gap:10px}
.sk{width:78px;height:78px;border-radius:50%;border:3px solid #1b1b1b;box-shadow:0 4px 0 #1b1b1b;background:#3E5C8A;color:#fff;font:inherit;font-size:13px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;cursor:pointer;padding:4px;-webkit-touch-callout:none}
.sk b{font-weight:500;font-size:12px;opacity:.85}
.sk .ic{display:block;font-size:24px;line-height:1.1}.sk:active{transform:translateY(3px);box-shadow:0 1px 0 #1b1b1b}
.sk.cd{opacity:.55;filter:grayscale(.6)}.sk.armed{background:#FFC93C;color:#3a2600}
.sk.fire{width:106px;height:106px;font-size:21px;background:conic-gradient(#FFC93C calc(var(--p,0)*1%),#E8553D 0);text-shadow:0 2px 0 #1b1b1b}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#hint{position:absolute;left:12px;bottom:12px;color:#fff;font-size:12px;background:rgba(20,30,20,.6);padding:5px 8px;border-radius:8px;pointer-events:none;max-width:46%}
#tip{position:absolute;left:50%;top:74px;transform:translateX(-50%);background:rgba(239,177,58,.95);color:#3a2600;padding:8px 14px;border-radius:12px;font-size:15px;pointer-events:none;text-align:center;max-width:80%}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,20,10,.5);overflow:auto;padding:12px;box-sizing:border-box}
.card{background:var(--panel);color:var(--chalk);border-radius:18px;padding:20px 20px 18px;max-width:680px;width:100%;box-shadow:0 0 0 4px var(--panel2) inset;max-height:100%;overflow:auto;box-sizing:border-box}
.card h1{margin:0 0 4px;font-size:30px;line-height:1.15}
.card p{margin:0 0 12px;color:var(--chalk2);font-size:14px;line-height:1.6}
.card h2{margin:14px 0 8px;font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.pick{flex:1 1 120px;border:2px dashed rgba(255,255,255,.35);background:transparent;color:var(--chalk);border-radius:12px;padding:10px;font:inherit;text-align:left;cursor:pointer;min-width:110px}
.pick[aria-pressed="true"]{border-style:solid;border-color:#fff;background:rgba(255,255,255,.12)}
.pick:disabled{opacity:.35;cursor:not-allowed}
.pick .nm{font-size:18px;display:block;margin-bottom:2px}
.pick small{display:block;font-size:12px;line-height:1.5;color:var(--chalk2)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.go{margin-top:16px;width:100%;border:0;border-radius:12px;padding:12px;font-size:20px;background:var(--gold);color:#3a2600;cursor:pointer}
.ctl{font-size:13px;color:var(--chalk2);line-height:1.7;margin-top:10px}
input.name{width:100%;box-sizing:border-box;font:inherit;font-size:20px;padding:10px 12px;border-radius:12px;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.2);color:var(--chalk)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{background:rgba(0,0,0,.18);border-radius:12px;padding:10px;min-height:60px}
.col h3{margin:0 0 6px;font-size:17px}
.pl{display:flex;align-items:center;gap:6px;font-size:14px;padding:3px 0}
.pl button{margin-left:auto;font:inherit;font-size:12px;border:0;border-radius:8px;padding:3px 8px;background:rgba(255,255,255,.15);color:var(--chalk);cursor:pointer}
.mvps{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px;text-align:left}
.mvp{background:rgba(0,0,0,.2);border-radius:12px;padding:10px;border-left:6px solid #fff}
.mvp small{display:block;color:var(--chalk2);font-size:12px}
.mvp b{display:block;font-size:18px;font-weight:500;margin:2px 0}
#teacher{position:absolute;left:10px;bottom:10px;width:290px;max-height:calc(100% - 140px);overflow:auto;background:rgba(20,40,20,.9);color:#f1efe8;border-radius:14px;padding:12px;font-size:13px;box-sizing:border-box}
#teacher h3{margin:0 0 8px;font-size:18px}
#teacher .btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#teacher .btns button{flex:1 1 40%;font:inherit;font-size:14px;border:0;border-radius:10px;padding:8px;background:#3d6e38;color:#fff;cursor:pointer}
#teacher .btns button.main{background:var(--gold);color:#3a2600}
#teacher select{font:inherit;padding:4px;border-radius:8px}
.url{font-size:13px;background:rgba(0,0,0,.25);padding:6px 8px;border-radius:8px;margin:4px 0;word-break:break-all}
@media (max-width:560px){.card h1{font-size:24px}.sk{width:66px;height:66px}.sk.fire{width:92px;height:92px}#mini{width:140px;height:84px}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="hud" hidden>
  <div id="score">
    <div class="t t0"><span class="jua">테크킹팀</span><span id="s0" class="jua">0</span><small id="f0">깃발</small></div>
    <div class="mid"><span id="clock" class="jua">5:00</span><small id="zone">거점 중립</small></div>
    <div class="t t1"><span class="jua">대니쌤팀</span><span id="s1" class="jua">0</span><small id="f1">깃발</small></div>
  </div>
</div>
<div id="tools" hidden><button id="muteBtn" type="button" aria-label="소리 켜고 끄기">🔊</button><button id="pauseBtn" type="button" aria-label="일시정지">⏸</button><button id="quitBtn" type="button" aria-label="그만하기">✕</button></div>
<div id="me" hidden></div>
<canvas id="mini" hidden></canvas>
<div id="banner"></div>
<div id="news"></div>
<div id="tip" hidden></div>
<div id="skills" hidden>
  <div class="skrow">
  <button class="sk" id="sk0" type="button"><span id="sk0n">스킬</span><b id="sk0c">Q</b></button>
  <button class="sk" id="sk1" type="button"><span id="sk1n">스킬</span><b id="sk1c">E</b></button>
  </div>
  <button class="sk fire jua" id="fire" type="button"><span>발사</span><b id="firec">길게 누르기</b></button>
</div>
<div id="hint" hidden>화면을 끌면 이동, 발사 버튼을 길게 누를수록 멀리 날아가요</div>
<div class="overlay" id="join" hidden>
  <div class="card">
    <h1 class="jua">테크킹 운동회 새총 대전</h1>
    <p>이름을 쓰고 하고 싶은 역할을 고르면 대기실로 들어가요. 팀은 자동으로 나뉘고, 선생님이 바꿀 수 있어요.</p>
    <h2 class="jua">이름</h2>
    <input class="name" id="nameIn" maxlength="10" placeholder="예: 김민준" autocomplete="off">
    <h2 class="jua">하고 싶은 역할</h2>
    <div class="row" id="jroles"></div>
    <button class="go jua" id="joinBtn" type="button">입장하기</button>
  </div>
</div>
<div class="overlay" id="lobby" hidden>
  <div class="card">
    <h1 class="jua" id="lbTitle">대기실</h1>
    <p id="lbText"></p>
    <div id="lbRoleWrap"><h2 class="jua">역할 바꾸기</h2><div class="row" id="lroles"></div></div>
    <div id="lbUrls"></div>
    <div class="cols" style="margin-top:12px">
      <div class="col"><h3 class="jua" style="color:#F5B8A0">테크킹팀 <span id="c0"></span></h3><div id="l0"></div></div>
      <div class="col"><h3 class="jua" style="color:#C9C4F2">대니쌤팀 <span id="c1"></span></h3><div id="l1"></div></div>
    </div>
  </div>
</div>
<div id="teacher" hidden>
  <h3 class="jua">선생님 조작판</h3>
  <div id="tState" style="margin-bottom:8px"></div>
  <div class="btns">
    <button class="main" id="tStart" type="button">경기 시작</button>
    <button id="tPause" type="button">일시정지</button>
    <button id="tStop" type="button">경기 끝내기</button>
    <button id="tLobby" type="button">대기실로</button>
    <button id="tShuffle" type="button">팀 섞기</button>
  </div>
  <label>경기 시간 <select id="tTime"><option value="180">3분</option><option value="300" selected>5분</option><option value="420">7분</option></select></label>
  <div style="margin-top:10px">학생 접속 주소</div>
  <div id="tUrls"></div>
  <div style="margin-top:10px">참가자 <span id="tCount">0</span>명 (빈자리는 봇이 채워요)</div>
  <div id="tList"></div>
</div>
<div id="conn" hidden style="position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:#E24B4A;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px"></div>

<div class="overlay" id="result" hidden>
  <div class="card" style="text-align:center">
    <canvas id="rLeader" width="260" height="132" style="width:260px;height:132px;display:block;margin:0 auto 4px;animation:jump .7s ease-in-out infinite"></canvas>
    <h1 class="jua" id="rTitle">경기 끝</h1>
    <p id="rText"></p>
    <h2 class="jua">역할별 MVP</h2>
    <div class="mvps" id="mvps"></div>
    <button class="go jua" id="again" type="button">다시 하기</button>
  </div>
</div>
</div>
<script>
/* ===== 게임 엔진 (서버와 웹 공통) ===== */
const W=2400,H=1440;
const TEAM=[{name:'테크킹팀',c:'#D85A30',l:'#F5B8A0',d:'#712B13'},{name:'대니쌤팀',c:'#6A60D0',l:'#C9C4F2',d:'#26215C'}];
const ROLES={
 atk:{name:'공격수',limit:6,hat:'#E24B4A',reload:3,speed:178,desc:'새총 공격이 가장 빨라요',skills:[{key:'bomb',name:'폭탄 돌',cd:20,arm:1},{key:'tri',name:'세 갈래',cd:15,arm:1}]},
 rep:{name:'수리공',limit:4,hat:'#EF9F27',reload:5.5,speed:175,desc:'가까운 벽을 자동으로 고쳐요',skills:[{key:'fix',name:'긴급 보수',cd:25},{key:'steel',name:'강철 벽돌',cd:20}]},
 shd:{name:'방패병',limit:3,hat:'#888780',reload:5.5,speed:158,desc:'앞쪽에서 오는 돌을 막아요',skills:[{key:'big',name:'거대 방패',cd:20},{key:'reflect',name:'되받아치기',cd:40}]},
 sup:{name:'지원가',limit:2,hat:'#1D9E75',reload:5.5,speed:178,desc:'숲 속 적을 넓게 찾아내요',skills:[{key:'cheer',name:'응원 버프',cd:30},{key:'smoke',name:'연막탄',cd:30,arm:1}]}
};
const ROLE_KEYS=['atk','rep','shd','sup'];
const RIVERS=[{x:1120,y:0,w:160,h:200},{x:1120,y:288,w:160,h:232},{x:1120,y:920,w:160,h:232},{x:1120,y:1240,w:160,h:200}];
const BRIDGES=[{x:1072,y:200,w:256,h:88},{x:1072,y:1152,w:256,h:88}];
const FORESTS=[{x:440,y:72,w:320,h:220},{x:440,y:1148,w:320,h:220},{x:1640,y:72,w:320,h:220},{x:1640,y:1148,w:320,h:220}];
const SUPPLY=[[848,428],[848,1012],[1552,428],[1552,1012]];
const ZONE={x:1200,y:720,r:170};
const CROSS=[244,720,1196];
const MAXHP=5,FLAGHP=10,MAG=3,GAP=.35;
let G=null,units=[];
const clamp=(v,a,b)=>v<a?a:v>b?b:v,hyp=Math.hypot,rnd=Math.random;
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function inRect(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h}
function rectDist(x,y,r){const cx=clamp(x,r.x,r.x+r.w),cy=clamp(y,r.y,r.y+r.h);return hyp(x-cx,y-cy)}
const FXD={hit:.25,poof:.6,boom:.45,fix:.3,spark:.25,dust:.25};
function fx(k,x,y,c){G.fx.push({x,y,t:FXD[k]||.3,k,c});G.ev.push([k,Math.round(x),Math.round(y),c||0])}
function float(x,y,txt,c,uid){const v=uid==null?-1:uid;G.floats.push({x,y,txt,c,t:1.2,uid:v});G.ev.push(['f',Math.round(x),Math.round(y),txt,c,v])}
function news(txt,team){G.ev.push(['n',txt,team==null?-1:team])}
function nm(u){return u.name==='나'?'내가':u.name+' 선수가'}
function sfx(k,x,y,uid){G.ev.push(['s',Math.round(x),Math.round(y),k,uid==null?-1:uid])}

function buildWalls(){const out=[];const add=(team,x,y,w,h,kind)=>{if(team===1)x=W-x-w;out.push({team,x,y,w,h,hp:2,max:2,armor:0,alive:true,kind})};
 for(const t of [0,1]){for(let i=0;i<5;i++)add(t,340,440+i*120,40,80,'outer');for(let i=0;i<5;i++)add(t,220,560+i*64,32,64,'inner');for(let i=0;i<4;i++){add(t,i*63,528,63,32,'armT');add(t,i*63,880,63,32,'armB')}}return out}
function makeUnit(team,role,human,name,cid){return{id:0,team,role,human,name,cid:cid==null?-1:cid,x:0,y:0,r:14,hp:MAXHP,dead:0,reload:rnd(),ammo:MAG,reloading:false,cds:[rnd()*6,rnd()*6],face:team?Math.PI:0,armed:null,bigT:0,reflT:0,repT:0,inv:0,inForest:false,vis:[true,true],
 input:{mx:0,my:0,ch:false},chV:0,charging:false,st:{hit:0,blk:0,fix:0,def:0,flag:0,ast:0,out:0},
 ai:{t:rnd()*.3,lane:CROSS[Math.floor(rnd()*3)],off:(rnd()-.5)*500,wantCenter:rnd()<.4,gx:W/2,gy:H/2,target:null,cross:null,st:0,lx:0,ly:0,unT:0,ux:0,uy:0,ph:rnd()*6}}}
function spawn(u){u.x=(u.team?2120:296)+(rnd()-.5)*16;u.y=600+rnd()*240;u.hp=MAXHP;u.dead=0;u.reload=.5;u.ammo=MAG;u.reloading=false;u.armed=null;u.bigT=0;u.reflT=0;u.inv=2;u.chV=0;u.charging=false;u.ai.cross=null;u.face=u.team?Math.PI:0}
/* cfg = {teams:[[{role,name,cid}],[...]], time, practice} */
function startMatch(cfg){
 const T=cfg.time||300;
 G={time:T,dur:T,practice:!!cfg.practice,easy:!!cfg.easy,cd:cfg.countdown===false?0:3,flagNewsT:[0,0],paused:false,over:false,result:null,bricks:[40,40],brickT:0,buffT:[0,0],buffBy:[null,null],capPts:[0,0],destroyed:[0,0],flagDmg:[0,0],cap:0,owner:-1,
  projs:[],fx:[],smokes:[],floats:[],ev:[],blocks:buildWalls(),flags:[{team:0,x:120,y:720,hp:FLAGHP,max:FLAGHP,r:22},{team:1,x:2280,y:720,hp:FLAGHP,max:FLAGHP,r:22}],
  supplies:SUPPLY.map(([x,y])=>({x,y,item:null,t:4})),t:0};
 units=[];
 for(const t of [0,1]){const cnt={};for(const k in ROLES)cnt[k]=ROLES[k].limit;
  for(const h of (cfg.teams[t]||[]).slice(0,15)){if(!(cnt[h.role]>0))h.role=ROLE_KEYS.find(k=>cnt[k]>0);cnt[h.role]--;units.push(makeUnit(t,h.role,true,h.name,h.cid))}
  let n=1;if(cfg.fill!==false)for(const k of ROLE_KEYS)for(let i=0;i<cnt[k];i++)units.push(makeUnit(t,k,false,'봇'+(n++)))}
 units.forEach((u,i)=>{u.id=i;spawn(u)});
}

/* ---------- mechanics ---------- */
function rateMul(t){let m=1;if(G.buffT[t]>0)m*=.5;if(!G.practice&&G.time<60)m*=.6;return m}
function enemySmoke(u){return G.smokes.find(s=>s.team!==u.team&&hyp(u.x-s.x,u.y-s.y)<s.r)||null}
function setCd(u,i){u.cds[i]=ROLES[u.role].skills[i].cd}
function shoot(u,ang,frac){if(u.dead>0||u.reload>0||u.ammo<=0||G.projs.length>220)return false;
 const sm=enemySmoke(u);if(sm){u.reload=.5;if(sm.by)sm.by.st.ast++;if(u.human)float(u.x,u.y-30,'연막 속이라 못 쏴요','#fff',u.id);return false}
 if(!u.human&&G.practice&&!u.trainer)return false;

 const lc=$('rLeader');if(lc&&lc.getContext){const g=lc.getContext('2d');if(g&&g.clearRect){g.clearRect(0,0,lc.width,lc.height);const ws=res.w<0?[0,1]:[res.w];ws.forEach((w,i)=>{const sp=sprite(w,'atk','F',w?'danny':'king');if(sp)g.drawImage(sp,ws.length>1?(i?130:10):60,0,120,132)})}}
 $('result').hidden=false}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function showPlayUI(play,spect){$('hud').hidden=false;['me','mini','skills','hint'].forEach(id=>$(id).hidden=!play);document.body.classList.toggle('tv',!!spect)}

/* ===== 서버 접속 모드 (학생 / TV / 선생님) ===== */
const MODE=location.pathname.startsWith('/tv')?'tv':location.pathname.startsWith('/teacher')?'teacher':'student';
let ws=null,myCid=-1,myRole='atk',LB=null,snapT=0,last=0,sendT=0,lastSent='',PIN='',joined=false;
const SNAPMS=1000/15;
let token='';try{token=sessionStorage.getItem('sb_token')||'';if(!token){token=Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem('sb_token',token)}}catch(_){token=Math.random().toString(36).slice(2)}
function wsend(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function conn(msg){$('conn').hidden=!msg;$('conn').textContent=msg||''}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>{conn('');wsend({t:'view',mode:MODE});if(MODE==='student'&&joined)wsend({t:'join',name:$('nameIn').value,role:myRole,token})};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}onMsg(m)};
 ws.onclose=()=>{conn('연결이 끊겼어요. 다시 연결하는 중...');setTimeout(connect,1500)}}
function roleButtons(el,cur,availFn,onPick){el.innerHTML='';for(const k of ROLE_KEYS){const r=ROLES[k],av=availFn(k);const b=document.createElement('button');b.className='pick';b.type='button';b.disabled=av<=0&&k!==cur;b.setAttribute('aria-pressed',k===cur);
 b.innerHTML=`<span class="nm jua"><span class="dot" style="background:${r.hat}"></span>${r.name}</span><small>${r.desc}<br>남은 자리 ${Math.max(0,av)}</small>`;b.onclick=()=>onPick(k);el.appendChild(b)}}
function countRole(t,k){return LB?LB.players.filter(p=>p.team===t&&p.role===k).length:0}
function availAny(k){return Math.max(ROLES[k].limit-countRole(0,k),ROLES[k].limit-countRole(1,k))}
function myP(){return LB?LB.players.find(p=>p.cid===myCid):null}
function renderLobby(){if(!LB)return;const P=LB.players;
 for(const t of [0,1]){const list=P.filter(p=>p.team===t);$('c'+t).textContent=list.length+'명';
  $('l'+t).innerHTML=list.map(p=>`<div class="pl"><span class="dot" style="background:${ROLES[p.role].hat}"></span>${esc(p.name)} · ${ROLES[p.role].name}${p.on?'':' (연결 끊김)'}${p.cid===myCid?' ← 나':''}</div>`).join('')||'<div class="pl" style="opacity:.6">아직 없어요</div>'}
 $('lbUrls').innerHTML=MODE==='tv'?'<p style="margin:8px 0 0">태블릿에서 아래 주소로 접속하세요</p>'+LB.urls.map(u=>`<div class="url jua" style="font-size:22px">${u}</div>`).join(''):'';
 if(MODE==='student'){const p=myP();if(p){$('lbTitle').textContent='대기실';$('lbText').textContent=`${p.name}님은 ${TEAM[p.team].name} ${ROLES[p.role].name}예요. 선생님이 시작하면 경기가 시작돼요.`;$('lbRoleWrap').hidden=false;
   roleButtons($('lroles'),p.role,k=>ROLES[k].limit-countRole(p.team,k),k=>{if(k!==p.role)wsend({t:'role',role:k})})}}
 else{$('lbTitle').textContent='새총 대전 대기실';$('lbText').textContent=`참가자 ${P.length}명 · 빈자리는 봇이 채워요 · 경기 시간 ${LB.time/60}분`;$('lbRoleWrap').hidden=true}
 if(MODE==='student'&&!joined)roleButtons($('jroles'),myRole,availAny,k=>{myRole=k;renderLobby()});
 if(MODE==='teacher')renderTeacher()}
function renderTeacher(){if(!LB)return;const st={lobby:'대기 중',playing:G&&G.paused?'일시정지':'경기 중',ended:'경기 끝'}[LB.state]||'';
 $('tState').textContent='상태: '+st;$('tCount').textContent=LB.players.length;$('tUrls').innerHTML=LB.urls.map(u=>`<div class="url">${u}</div>`).join('')+`<div class="url">TV 화면: ${LB.urls[0]}/tv</div>`;
 $('tTime').value=String(LB.time);$('tPause').textContent=G&&G.paused?'다시 시작':'일시정지';
 const playing=LB.state==='playing';
 $('tList').innerHTML=LB.players.map(p=>`<div class="pl"><span class="dot" style="background:${TEAM[p.team].c}"></span>${esc(p.name)} · ${ROLES[p.role].name}${p.on?'':' (끊김)'}${playing?'':`<button type="button" data-team="${p.cid}">팀 바꾸기</button>`}<button type="button" data-kick="${p.cid}">내보내기</button></div>`).join('')}
function admin(cmd,extra){wsend(Object.assign({t:'admin',cmd,pin:PIN},extra||{}))}
function initMatch(m){G={time:m.time,dur:m.time,practice:false,paused:false,over:false,result:null,bricks:[30,30],buffT:[0,0],cap:0,owner:-1,projs:[],fx:[],smokes:[],floats:[],ev:[],blocks:buildWalls(),
  flags:[{team:0,x:120,y:720,hp:FLAGHP,max:FLAGHP,r:22},{team:1,x:2280,y:720,hp:FLAGHP,max:FLAGHP,r:22}],supplies:SUPPLY.map(([x,y])=>({x,y,item:null,t:0})),t:0,sc:[0,0]};
 units=m.roster.map((r,i)=>{const u=makeUnit(r[0],ROLE_KEYS[r[1]],!!r[2],r[3],r[4]);u.id=i;spawn(u);u.ox=u.tx=u.x;u.oy=u.ty=u.y;return u});
 bindMe();$('lobby').hidden=true;$('join').hidden=true;$('result').hidden=true;resize()}
function bindMe(){me=MODE==='student'?units.find(u=>u.human&&u.cid===myCid)||null:null;SPECT=!me;showPlayUI(!!me,SPECT);$('tools').hidden=false;$('pauseBtn').hidden=true;$('quitBtn').hidden=true;if(me){camX=me.x;camY=me.y}}
function applySnap(m){if(!G)return;const now=performance.now();snapT=now;
 G.time=m.tm;G.cd=m.cd||0;G.bl=m.bl||[];G.paused=!!m.pz;G.sc=m.sc;G.flags[0].hp=m.fl[0];G.flags[1].hp=m.fl[1];G.owner=m.ow;G.cap=m.cp;G.bricks=m.br;G.buffT=m.bf;
 m.u.forEach((a,i)=>{const u=units[i];if(!u)return;const bits=a[4],wasDead=u.dead>0;u.face=a[2]/100;u.hp=a[3];u.dead=(bits&1)?Math.max(.1,a[5]):0;u.inForest=!!(bits&2);u.inv=(bits&4)?1:0;u.bigT=(bits&8)?1:0;u.reflT=(bits&16)?1:0;u.vis=[!!(bits&64),!!(bits&128)];
  if(u!==me)u.armed=(bits&32)?'x':null;
  if(u===me){u.tx=a[0];u.ty=a[1];const lead=ROLES[u.role].speed*.12,ex=a[0]+INP.mx*lead,ey=a[1]+INP.my*lead;if(wasDead||u.dead>0||hyp(ex-u.x,ey-u.y)>90){u.x=a[0];u.y=a[1]}}
  else{if(wasDead&&!u.dead){u.x=a[0];u.y=a[1]}u.ox=u.x;u.oy=u.y;u.tx=a[0];u.ty=a[1]}});
 for(let i=0;i<G.blocks.length;i++){const v=+m.b[i]||0,b=G.blocks[i];if(!v){b.alive=false;b.hp=0;b.armor=0}else{b.alive=true;b.hp=Math.floor((v-1)/3);b.armor=(v-1)%3}}
 G.projs=[];for(let i=0;i<m.p.length;i+=5){const k=m.p[i+3];G.projs.push({x:m.p[i],y:m.p[i+1],a:m.p[i+2]/100,kind:['stone','bomb','smoke'][k>>1],team:k&1,h:m.p[i+4]/100})}
 G.smokes=m.sm.map(s=>({x:s[0],y:s[1],team:s[2],t:s[3]/10,r:140}));
 for(let i=0;i<G.supplies.length;i++){const ch=m.sp[i];G.supplies[i].item=ch==='b'?'brick':ch==='r'?'reset':ch==='h'?'heal':null}
 for(const e of m.ev){if(e[0]==='f')G.floats.push({x:e[1],y:e[2],txt:e[3],c:e[4],uid:e[5],t:1.2});else if(e[0]!=='s'&&e[0]!=='n')G.fx.push({k:e[0],x:e[1],y:e[2],c:e[3]||null,t:FXD[e[0]]||.3})}
 playEvents(m.ev);
 if(m.my&&me){me.cds=m.my.c;me.reload=m.my.r;me.ammo=m.my.m;me.reloading=!!m.my.rl;me.armed=m.my.a;me.st=m.my.st}}
function frame(dt){if(!G)return;G.t=performance.now()/1000;const k=clamp((performance.now()-snapT)/SNAPMS,0,1);
 for(const u of units){if(u===me)continue;if(u.tx!=null){u.x=u.ox+(u.tx-u.ox)*k;u.y=u.oy+(u.ty-u.oy)*k}}
 if(me&&me.dead<=0&&!G.paused&&!G.over&&!(G.cd>0)){move(me,INP.mx,INP.my,dt);if(INP.mx||INP.my)me.face=Math.atan2(INP.my,INP.mx);
  const lead=ROLES[me.role].speed*.12,ex=me.tx+INP.mx*lead,ey=me.ty+INP.my*lead;const f=(INP.mx||INP.my)?.05:.2;me.x+=(ex-me.x)*f;me.y+=(ey-me.y)*f}
 for(const p of G.projs){p.x+=Math.cos(p.a)*720*dt;p.y+=Math.sin(p.a)*720*dt}
 G.fx.forEach(f=>f.t-=dt);G.fx=G.fx.filter(f=>f.t>0);G.floats.forEach(f=>{f.t-=dt;f.y-=30*dt});G.floats=G.floats.filter(f=>f.t>0)}
function onMsg(m){
 if(m.t==='hello'){if(MODE==='teacher'&&m.pin&&!PIN){PIN=prompt('선생님 비밀번호를 입력하세요')||''}}
 else if(m.t==='lobby'){LB=m;if(m.state==='lobby'){G=null;units=[];me=null;['hud','me','mini','skills','hint','tools'].forEach(id=>$(id).hidden=true);$('result').hidden=true;document.body.classList.remove('tv');
   if(MODE==='student')$(joined?'lobby':'join').hidden=false,$(joined?'join':'lobby').hidden=true;else $('lobby').hidden=MODE==='teacher'}
  renderLobby()}
 else if(m.t==='you'){myCid=m.cid;myRole=m.role;joined=true;$('join').hidden=true;if(!G)$('lobby').hidden=false;renderLobby()}
 else if(m.t==='init'){initMatch(m)}
 else if(m.t==='roster'){const u=units[m.i];if(u){u.human=!!m.h;u.name=m.n;u.cid=m.c;if(MODE==='student'&&u.cid===myCid&&!me)bindMe()}}
 else if(m.t==='s'){applySnap(m);if(MODE==='teacher')renderTeacher()}
 else if(m.t==='end'){if(G){G.over=true;G.sc=m.sc}['skills','hint'].forEach(id=>$(id).hidden=true);showResult(m.res,m.mvp,'');if(MODE==='teacher')renderTeacher()}
 else if(m.t==='err'){alert(m.msg);if(m.kick){joined=false;$('lobby').hidden=true;$('join').hidden=false}}}
onSkill=i=>wsend({t:'sk',i});
$('muteBtn').hidden=false;
if(MODE==='student'){$('join').hidden=false;try{$('nameIn').value=sessionStorage.getItem('sb_name')||''}catch(_){}
 $('joinBtn').onclick=()=>{audioInit();const n=$('nameIn').value.trim();if(!n){$('nameIn').focus();return}try{sessionStorage.setItem('sb_name',n)}catch(_){}joined=true;wsend({t:'join',name:n,role:myRole,token})};
 roleButtons($('jroles'),myRole,()=>1,k=>{myRole=k;renderLobby()})}
else{$('lobby').hidden=MODE==='teacher';document.body.addEventListener('pointerdown',()=>audioInit(),{once:true})}
if(MODE==='teacher'){$('teacher').hidden=false;
 $('tStart').onclick=()=>admin('start',{time:+$('tTime').value});$('tPause').onclick=()=>admin(G&&G.paused?'resume':'pause');$('tStop').onclick=()=>{if(confirm('경기를 지금 끝낼까요?'))admin('stop')};
 $('tLobby').onclick=()=>admin('lobby');$('tShuffle').onclick=()=>admin('shuffle');$('tTime').onchange=()=>admin('time',{time:+$('tTime').value});
 $('tList').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.team)admin('team',{cid:+b.dataset.team});if(b.dataset.kick&&confirm('이 학생을 내보낼까요?'))admin('kick',{cid:+b.dataset.kick})}}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;readInput(dt);frame(dt);
 sendT-=dt;if(me&&G&&!G.over){const s=INP.mx+','+INP.my+','+(INP.ch?1:0);if(sendT<=0&&(s!==lastSent||sendT<-.25)){wsend({t:'in',mx:INP.mx,my:INP.my,ch:INP.ch?1:0});lastSent=s;sendT=.05}}
 draw();hudT-=dt;if(hudT<=0&&G){hud();hudT=.1}requestAnimationFrame(loop)}
connect();resize();requestAnimationFrame(loop);

</script>
</body>
</html>
